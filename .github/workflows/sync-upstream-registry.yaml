name: Sync Upstream and Rebuild Registry

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-registry
  cancel-in-progress: false

env:
  TEMP_BRANCH: automation/sync-upstream-${{ github.run_id }}-${{ github.run_attempt }}
  UPSTREAM_REPOSITORY: shadcnblocks/kibo
  UPSTREAM_BRANCH: main

jobs:
  sync-upstream:
    name: Sync upstream and rebuild registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.REGISTRY_TOKEN_SYNC }}

      - name: Create temporary branch
        run: git switch --create "$TEMP_BRANCH"

      - name: Sync with upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/$UPSTREAM_REPOSITORY.git"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          git merge --no-edit "upstream/$UPSTREAM_BRANCH"

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # ratchet:pnpm/action-setup@v6.0.9

      - name: Setup node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # ratchet:actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export versioned registry payloads
        run: node --experimental-strip-types .github/scripts/export-registry.mjs

      - name: Commit registry output
        id: commit
        run: |
          git add --all --force -- apps/registry/dist

          if ! git diff --cached --quiet; then
            git commit -m "feat(registry): rebuild vendored output from updated fork"
          fi

          if [[ "$(git rev-list --count origin/main..HEAD)" == "0" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No upstream or generated registry changes were found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Push temporary branch
        if: steps.commit.outputs.has_changes == 'true'
        run: git push --set-upstream origin "$TEMP_BRANCH"

      - name: Create pull request
        if: steps.commit.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_TOKEN_SYNC }}
        run: |
          upstream_sha="$(git rev-parse "upstream/$UPSTREAM_BRANCH")"
          upstream_url="https://github.com/$UPSTREAM_REPOSITORY/commit/$upstream_sha"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          printf '%s\n' \
            '## Summary' \
            '' \
            "- sync with [$UPSTREAM_REPOSITORY@$upstream_sha]($upstream_url)" \
            '- rebuild the versioned Kibo registry JSON from the shared package generator' \
            '' \
            "Generated by [workflow run $GITHUB_RUN_ID]($run_url)." \
            > "$RUNNER_TEMP/pull-request-body.md"

          pr_url="$(gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$GITHUB_REPOSITORY_OWNER:$TEMP_BRANCH" \
            --title "feat: sync/update based on upstream and rebuild registry" \
            --body-file "$RUNNER_TEMP/pull-request-body.md")"
          echo "Created pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"
